[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-visuals"
version = "0.2.0"
description = "Turn an open-source repository into a reusable launch identity and six-asset visual kit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "Pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/Sheldon715/repo-visuals"
