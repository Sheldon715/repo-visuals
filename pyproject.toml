[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-visuals"
version = "0.1.0"
description = "Generate a consistent visual launch kit for an open-source repository."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "Pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/Sheldon715/repo-visuals"
